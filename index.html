<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Workout PRO - Personaggio 2D Professionale</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
      color: #fff;
      font-family: 'Arial', sans-serif;
      overflow: hidden;
    }
    #app {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 1.5vh 1vw;
      gap: 1vh;
    }
    .header {
      text-align: center;
      flex-shrink: 0;
    }
    .header h1 {
      font-size: 4vh;
      background: linear-gradient(90deg, #00d4ff, #00ff88);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5vh;
      font-weight: 900;
      letter-spacing: 2px;
    }
    .header p {
      font-size: 2vh;
      opacity: 0.8;
    }
    .main {
      display: flex;
      flex: 1;
      gap: 1vw;
      min-height: 0;
    }
    .left {
      width: 18vw;
      display: flex;
      flex-direction: column;
      gap: 1vh;
    }
    .box {
      background: linear-gradient(135deg, rgba(0, 212, 255, 0.15), rgba(0, 212, 255, 0.05));
      border: 2px solid rgba(0, 212, 255, 0.5);
      border-radius: 15px;
      padding: 2vh 1vw;
      text-align: center;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      backdrop-filter: blur(10px);
    }
    .label {
      font-size: 1.6vh;
      opacity: 0.7;
      margin-bottom: 0.5vh;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .value {
      font-size: 4.5vh;
      font-weight: 900;
      background: linear-gradient(135deg, #00d4ff, #00ff88);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .center {
      flex: 1;
      background: linear-gradient(135deg, rgba(0, 212, 255, 0.08), rgba(0, 212, 255, 0.03));
      border: 3px solid rgba(0, 212, 255, 0.4);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2vh;
      min-height: 0;
      position: relative;
      backdrop-filter: blur(10px);
    }
    #exName {
      font-size: 3.5vh;
      font-weight: 900;
      margin-bottom: 1vh;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    #exName.work { 
      background: linear-gradient(135deg, #00d4ff, #0099cc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    #exName.rest { 
      background: linear-gradient(135deg, #00ff88, #00cc66);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    #characterCanvas {
      flex: 1;
      width: 100%;
      min-height: 0;
    }
    
    #exTime {
      font-size: 10vh;
      font-weight: 900;
      margin: 1vh 0;
      text-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
    }
    #exTime.warn { 
      color: #ffaa00;
      text-shadow: 0 0 30px rgba(255, 170, 0, 0.8);
    }
    #exTime.crit { 
      color: #ff4444;
      animation: blink 0.5s infinite;
      text-shadow: 0 0 30px rgba(255, 68, 68, 0.8);
    }
    @keyframes blink { 50% { opacity: 0.7; transform: scale(1.05); } }
    
    #reps {
      font-size: 2.2vh;
      color: #00d4ff;
      font-style: italic;
      font-weight: 600;
    }
    .right {
      width: 18vw;
      display: flex;
      flex-direction: column;
      gap: 1vh;
    }
    .nextbox {
      background: linear-gradient(135deg, rgba(0, 255, 136, 0.15), rgba(0, 255, 136, 0.05));
      border: 2px solid rgba(0, 255, 136, 0.5);
      border-radius: 15px;
      padding: 2vh 1vw;
      flex: 1;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(10px);
    }
    #next {
      font-size: 1.9vh;
      color: #00ff88;
      font-weight: 700;
      margin-top: 1vh;
      line-height: 1.4;
    }
    .progbox {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 15px;
      padding: 2vh 1vw;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      backdrop-filter: blur(10px);
    }
    .bar {
      width: 100%;
      height: 3vh;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 1.5vh;
      overflow: hidden;
      margin-top: 1vh;
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.3);
    }
    .fill {
      height: 100%;
      background: linear-gradient(90deg, #00d4ff, #00ff88);
      width: 0%;
      transition: width 1s;
      box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
    }
    #pct {
      margin-top: 0.8vh;
      font-size: 2.5vh;
      text-align: center;
      font-weight: 700;
    }
    .btns {
      display: flex;
      justify-content: center;
      gap: 1.5vw;
      flex-shrink: 0;
      padding: 1vh 0;
    }
    button {
      font-size: 2.2vh;
      padding: 1.8vh 4vw;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 900;
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }
    button:hover:not(:disabled) { 
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
    }
    button:active:not(:disabled) { transform: translateY(0); }
    button:disabled { opacity: 0.3; cursor: not-allowed; }
    .btn1 { background: linear-gradient(135deg, #00d4ff, #0099cc); color: #fff; }
    .btn2 { background: linear-gradient(135deg, #ffaa00, #ff8800); color: #fff; }
    .btn3 { background: linear-gradient(135deg, #ff4444, #cc0000); color: #fff; }
    
    .settings {
      position: fixed;
      top: 1vh;
      right: 1vw;
      display: flex;
      gap: 0.8vw;
      z-index: 100;
    }
    .settings label {
      background: rgba(0, 0, 0, 0.8);
      padding: 0.8vh 1.5vw;
      border-radius: 10px;
      border: 2px solid rgba(0, 212, 255, 0.5);
      font-size: 1.5vh;
      display: flex;
      align-items: center;
      gap: 0.5vw;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.3s;
    }
    .settings label:hover {
      border-color: #00d4ff;
      background: rgba(0, 212, 255, 0.1);
    }
    .settings select {
      padding: 0.8vh 1.5vw;
      border-radius: 10px;
      font-size: 1.5vh;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      border: 2px solid rgba(0, 212, 255, 0.5);
      cursor: pointer;
      backdrop-filter: blur(10px);
    }
    .done {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.95);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      backdrop-filter: blur(10px);
    }
    .done.show { display: flex; }
    .done-box {
      background: linear-gradient(135deg, rgba(0, 255, 136, 0.2), rgba(0, 255, 136, 0.1));
      border: 4px solid #00ff88;
      border-radius: 30px;
      padding: 60px 100px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 255, 136, 0.3);
    }
    .done-box h2 {
      font-size: 80px;
      font-weight: 900;
      background: linear-gradient(135deg, #00ff88, #00cc66);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 30px;
    }
    .done-box p {
      font-size: 35px;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <div class="settings">
    <label><input type="checkbox" id="snd" checked> 🔊</label>
    <label><input type="checkbox" id="mus" checked> 🎵</label>
    <select id="lng">
      <option value="it">🇮🇹</option>
      <option value="en">🇬🇧</option>
    </select>
  </div>

  <div id="app">
    <div class="header">
      <h1>💪 WORKOUT PROFESSIONAL 2D</h1>
      <p>Personaggio animato con movimento fluido e preciso</p>
    </div>
    
    <div class="main">
      <div class="left">
        <div class="box">
          <div class="label">Tempo Totale</div>
          <div class="value" id="totTime">20:00</div>
        </div>
        <div class="box">
          <div class="label">Esercizio</div>
          <div class="value" id="exNum">0/37</div>
        </div>
        <div class="box">
          <div class="label">Oggi</div>
          <div class="value" id="today">0</div>
        </div>
      </div>
      
      <div class="center">
        <div id="exName" class="work">PREMI START</div>
        <canvas id="characterCanvas"></canvas>
        <div id="exTime">00:00</div>
        <div id="reps"></div>
      </div>
      
      <div class="right">
        <div class="nextbox">
          <div class="label">⏭ Prossimo</div>
          <div id="next">-</div>
        </div>
        <div class="progbox">
          <div class="label">Progresso</div>
          <div class="bar">
            <div class="fill" id="prog"></div>
          </div>
          <div id="pct">0%</div>
        </div>
      </div>
    </div>
    
    <div class="btns">
      <button class="btn1" id="startBtn">▶ START</button>
      <button class="btn2" id="pauseBtn" disabled>⏸ PAUSA</button>
      <button class="btn3" id="resetBtn" disabled>↻ RESET</button>
    </div>
  </div>

  <div class="done" id="doneScreen">
    <div class="done-box">
      <h2>🎉 COMPLETATO!</h2>
      <p>Ottimo lavoro!<br>Hai bruciato circa <strong>150-200 calorie</strong>!</p>
      <p>Totale: <strong id="totW">0</strong> allenamenti</p>
      <button class="btn1" style="margin-top:40px;font-size:2rem;padding:1.5rem 3rem;" id="closeBtn">OK</button>
    </div>
  </div>

  <script>
    console.log('🚀 App 2D Professional avviata');
    
    const EXERCISES = [
      {id:'w',dur:50},{id:'r',dur:20},
      {id:'s',dur:45},{id:'r',dur:20},
      {id:'l',dur:45},{id:'r',dur:20},
      {id:'p',dur:40},{id:'r',dur:20},
      {id:'k',dur:35},{id:'r',dur:20},
      {id:'m',dur:45},{id:'r',dur:20},
      {id:'b',dur:35},{id:'r',dur:20},
      {id:'c',dur:45},{id:'r',dur:20},
      {id:'h',dur:45},{id:'r',dur:20},
      {id:'g',dur:45},{id:'r',dur:20},
      {id:'j',dur:50},{id:'r',dur:20},
      {id:'s',dur:45},{id:'r',dur:20},
      {id:'u',dur:35},{id:'r',dur:20},
      {id:'l',dur:45},{id:'r',dur:20},
      {id:'p',dur:40},{id:'r',dur:20},
      {id:'m',dur:45},{id:'r',dur:20},
      {id:'c',dur:45},{id:'r',dur:20},
      {id:'j',dur:45},{id:'r',dur:20},
      {id:'t',dur:60}
    ];

    const TOTAL_TIME = EXERCISES.reduce((sum, ex) => sum + ex.dur, 0);

    const NAMES = {
      it: {
        w:['Riscaldamento: Jumping Jack','30-40 ripetizioni'],
        r:['Riposo','Respira e recupera'],
        s:['Squat','15-20 ripetizioni'],
        l:['Affondi Alternati','10-12 per gamba'],
        p:['Push-up','10-15 ripetizioni'],
        k:['Plank','mantieni posizione'],
        m:['Mountain Climbers','30-40 ripetizioni'],
        b:['Burpees','8-12 ripetizioni'],
        c:['Crunch','20-25 ripetizioni'],
        h:['High Knees','40-50 ripetizioni'],
        g:['Ponte Glutei','15-20 ripetizioni'],
        j:['Jumping Jacks','30-40 ripetizioni'],
        u:['Superman','15-20 ripetizioni'],
        t:['Stretching','respira profondamente']
      },
      en: {
        w:['Warm-up: Jumping Jacks','30-40 reps'],
        r:['Rest','Breathe and recover'],
        s:['Squats','15-20 reps'],
        l:['Alternating Lunges','10-12 per leg'],
        p:['Push-ups','10-15 reps'],
        k:['Plank','hold position'],
        m:['Mountain Climbers','30-40 reps'],
        b:['Burpees','8-12 reps'],
        c:['Crunches','20-25 reps'],
        h:['High Knees','40-50 reps'],
        g:['Glute Bridge','15-20 reps'],
        j:['Jumping Jacks','30-40 reps'],
        u:['Superman','15-20 reps'],
        t:['Stretching','breathe deeply']
      }
    };

    let lang = 'it';
    let state = {
      currentIndex: 0,
      timeLeft: 0,
      globalTimeLeft: TOTAL_TIME,
      timer: null,
      isPaused: false,
      isRunning: false
    };

    const canvas = document.getElementById('characterCanvas');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
      const container = canvas.parentElement;
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    let audioCtx = null;
    let musicTimer = null;

    function getEl(id) { return document.getElementById(id); }

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function beep(freq, dur) {
      if (!getEl('snd').checked) return;
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    }

    function startMusic() {
      if (!getEl('mus').checked) return;
      initAudio();
      stopMusic();
      const notes = [262, 330, 392, 330];
      let idx = 0;
      musicTimer = setInterval(() => {
        if (!getEl('mus').checked || !state.isRunning || state.isPaused) {
          stopMusic();
          return;
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = notes[idx];
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
        idx = (idx + 1) % notes.length;
      }, 400);
    }

    function stopMusic() {
      if (musicTimer) {
        clearInterval(musicTimer);
        musicTimer = null;
      }
    }

    // ========================================
    // PERSONAGGIO 2D PROFESSIONALE
    // ========================================
    class Character {
      constructor() {
        this.time = 0;
        this.colors = {
          skin: '#FFD1A4',
          hair: '#8B4513',
          shirt: '#FF6B6B',
          pants: '#4A90E2',
          shoes: '#333333',
          glow: 'rgba(0, 212, 255, 0.3)'
        };
      }

      drawSmooth(ex) {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;
        const scale = Math.min(w, h) / 600;
        const t = this.time * 0.001;

        ctx.clearRect(0, 0, w, h);
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(scale, scale);

        // Ombra
        ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
        ctx.beginPath();
        ctx.ellipse(0, 140, 80, 15, 0, 0, Math.PI * 2);
        ctx.fill();

        if (ex === 'r') {
          this.drawRest(t);
        } else if (ex === 'w' || ex === 'j') {
          this.drawJumpingJack(t);
        } else if (ex === 's') {
          this.drawSquat(t);
        } else if (ex === 'l' || ex === 'h' || ex === 'm') {
          this.drawRunning(t);
        } else if (ex === 'p') {
          this.drawPushUp(t);
        } else if (ex === 'k') {
          this.drawPlank(t);
        } else if (ex === 'b') {
          this.drawBurpees(t);
        } else if (ex === 'c') {
          this.drawCrunch(t);
        } else if (ex === 'g') {
          this.drawBridge(t);
        } else if (ex === 'u') {
          this.drawSuperman(t);
        } else if (ex === 't') {
          this.drawStretch(t);
        } else {
          this.drawRest(t);
        }

        ctx.restore();
        this.time += 16;
      }

      drawBody(x, y, w, h, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.roundRect(x - w/2, y - h/2, w, h, 10);
        ctx.fill();
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.2)';
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      drawCircle(x, y, r, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.2)';
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      drawLimb(x1, y1, x2, y2, width, color) {
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
        
        // Glow effect
        ctx.strokeStyle = this.colors.glow;
        ctx.lineWidth = width + 4;
        ctx.globalAlpha = 0.3;
        ctx.stroke();
        ctx.globalAlpha = 1;
      }

      drawRest(t) {
        const breathe = Math.sin(t * 2) * 3;
        
        // Head
        this.drawCircle(0, -110 + breathe, 30, this.colors.skin);
        // Eyes
        ctx.fillStyle = '#000';
        ctx.fillRect(-10, -115 + breathe, 5, 8);
        ctx.fillRect(5, -115 + breathe, 5, 8);
        // Smile
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, -105 + breathe, 12, 0.2, Math.PI - 0.2);
        ctx.stroke();
        
        // Body
        this.drawBody(0, -40 + breathe, 50, 80, this.colors.shirt);
        
        // Arms relaxed
        this.drawLimb(-25, -60 + breathe, -50, -10 + breathe, 14, this.colors.skin);
        this.drawLimb(-50, -10 + breathe, -55, 20 + breathe, 12, this.colors.skin);
        this.drawCircle(-55, 20 + breathe, 10, this.colors.skin);
        
        this.drawLimb(25, -60 + breathe, 50, -10 + breathe, 14, this.colors.skin);
        this.drawLimb(50, -10 + breathe, 55, 20 + breathe, 12, this.colors.skin);
        this.drawCircle(55, 20 + breathe, 10, this.colors.skin);
        
        // Legs
        this.drawLimb(-15, 5, -25, 80, 18, this.colors.pants);
        this.drawLimb(-25, 80, -30, 135, 16, this.colors.skin);
        this.drawBody(-30, 140, 22, 12, this.colors.shoes);
        
        this.drawLimb(15, 5, 25, 80, 18, this.colors.pants);
        this.drawLimb(25, 80, 30, 135, 16, this.colors.skin);
        this.drawBody(30, 140, 22, 12, this.colors.shoes);
      }

      drawJumpingJack(t) {
        const phase = Math.sin(t * 4);
        const open = Math.abs(phase);
        const jump = Math.abs(phase) * 20;
        
        // Head
        this.drawCircle(0, -110 - jump, 30, this.colors.skin);
        ctx.fillStyle = '#000';
        ctx.fillRect(-10, -115 - jump, 5, 8);
        ctx.fillRect(5, -115 - jump, 5, 8);
        
        // Body
        this.drawBody(0, -40 - jump, 50, 80, this.colors.shirt);
        
        // Arms - opening
        const armX = 70 * open;
        const armY = -50 * open;
        this.drawLimb(-25, -60 - jump, -50 - armX, -30 - jump + armY, 14, this.colors.skin);
        this.drawLimb(-50 - armX, -30 - jump + armY, -60 - armX, armY - jump, 12, this.colors.skin);
        this.drawCircle(-60 - armX, armY - jump, 10, this.colors.skin);
        
        this.drawLimb(25, -60 - jump, 50 + armX, -30 - jump + armY, 14, this.colors.skin);
        this.drawLimb(50 + armX, -30 - jump + armY, 60 + armX, armY - jump, 12, this.colors.skin);
        this.drawCircle(60 + armX, armY - jump, 10, this.colors.skin);
        
        // Legs - opening
        const legX = 40 * open;
        this.drawLimb(-15, 5 - jump, -25 - legX, 80 - jump, 18, this.colors.pants);
        this.drawLimb(-25 - legX, 80 - jump, -30 - legX, 135, 16, this.colors.skin);
        this.drawBody(-30 - legX, 140, 22, 12, this.colors.shoes);
        
        this.drawLimb(15, 5 - jump, 25 + legX, 80 - jump, 18, this.colors.pants);
        this.drawLimb(25 + legX, 80 - jump, 30 + legX, 135, 16, this.colors.skin);
        this.drawBody(30 + legX, 140, 22, 12, this.colors.shoes);
      }

      drawSquat(t) {
        const depth = Math.sin(t * 3) * 0.5 + 0.5;
        const down = depth * 50;
        
        // Head
        this.drawCircle(0, -110 + down, 30, this.colors.skin);
        ctx.fillStyle = '#000';
        ctx.fillRect(-10, -115 + down, 5, 8);
        ctx.fillRect(5, -115 + down, 5, 8);
        
        // Body
        this.drawBody(0, -40 + down, 50, 80, this.colors.shirt);
        
        // Arms forward
        this.drawLimb(-25, -60 + down, -70, -20 + down, 14, this.colors.skin);
        this.drawLimb(-70, -20 + down, -100, -15 + down, 12, this.colors.skin);
        this.drawCircle(-100, -15 + down, 10, this.colors.skin);
        
        this.drawLimb(25, -60 + down, 70, -20 + down, 14, this.colors.skin);
        this.drawLimb(70, -20 + down, 100, -15 + down, 12, this.colors.skin);
        this.drawCircle(100, -15 + down, 10, this.colors.skin);
        
        // Legs bent
        const kneeY = 50 + down;
        this.drawLimb(-15, 5 + down, -25, kneeY, 18, this.colors.pants);
        this.drawLimb(-25, kneeY, -30, 135, 16, this.colors.skin);
        this.drawBody(-30, 140, 22, 12, this.colors.shoes);
        
        this.drawLimb(15, 5 + down, 25, kneeY, 18, this.colors.pants);
        this.drawLimb(25, kneeY, 30, 135, 16, this.colors.skin);
        this.drawBody(30, 140, 22, 12, this.colors.shoes);
      }

      drawRunning(t) {
        const phase = Math.sin(t * 5);
        const bob = Math.abs(phase) * 10;
        
        // Head
        this.drawCircle(0, -110 - bob, 30, this.colors.skin);
        ctx.fillStyle = '#000';
        ctx.fillRect(-10, -115 - bob, 5, 8);
        ctx.fillRect(5, -115 - bob, 5, 8);
        
        // Body leaning
        this.drawBody(5, -40 - bob, 50, 80, this.colors.shirt);
        
        // Arms alternating
        const armSwing = phase * 40;
        this.drawLimb(-20, -60 - bob, -40 - armSwing, -15 - bob, 14, this.colors.skin);
        this.drawLimb(-40 - armSwing, -15 - bob, -50 - armSwing, 20 - bob, 12, this.colors.skin);
        this.drawCircle(-50 - armSwing, 20 - bob, 10, this.colors.skin);
        
        this.drawLimb(30, -60 - bob, 50 + armSwing, -15 - bob, 14, this.colors.skin);
        this.drawLimb(50 + armSwing, -15 - bob, 60 + armSwing, 20 - bob, 12, this.colors.skin);
        this.drawCircle(60 + armSwing, 20 - bob, 10, this.colors.skin);
        
        // Legs alternating
        const legAngle = phase * 50;
        this.drawLimb(-10, 5 - bob, -15 - legAngle, 80 - bob, 18, this.colors.pants);
        this.drawLimb(-15 - legAngle, 80 - bob, -20 - legAngle, 135, 16, this.colors.skin);
        this.drawBody(-20 - legAngle, 140, 22, 12, this.colors.shoes);
        
        this.drawLimb(20, 5 - bob, 25 + legAngle, 80 - bob, 18, this.colors.pants);
        this.drawLimb(25 + legAngle, 80 - bob, 30 + legAngle, 135, 16, this.colors.skin);
        this.drawBody(30 + legAngle, 140, 22, 12, this.colors.shoes);
      }

      drawPushUp(t) {
        const push = Math.sin(t * 3) * 15;
        
        ctx.save();
        ctx.translate(0, 80 + push);
        ctx.rotate(-0.15);
        
        // Head
        this.drawCircle(-80, -40, 30, this.colors.skin);
        ctx.fillStyle = '#000';
        ctx.fillRect(-85, -45, 5, 8);
        
        // Body
        this.drawBody(-20, -30, 90, 50, this.colors.shirt);
        
        // Arms
        this.drawLimb(-60, -20, -90, 10, 16, this.colors.skin);
        this.drawLimb(-90, 10, -110, 40, 14, this.colors.skin);
        this.drawCircle(-110, 40, 12, this.colors.skin);
        
        this.drawLimb(30, -20, 60, 10, 16, this.colors.skin);
        this.drawLimb(60, 10, 80, 40, 14, this.colors.skin);
        this.drawCircle(80, 40, 12, this.colors.skin);
        
        // Legs
        this.drawLimb(40, -10, 80, -5, 18, this.colors.pants);
        this.drawLimb(80, -5, 110, 0, 16, this.colors.skin);
        this.drawBody(115, 0, 20, 14, this.colors.shoes);
        
        ctx.restore();
      }

      drawPlank(t) {
        ctx.save();
        ctx.translate(0, 80);
        ctx.rotate(-0.15);
        
        // Head
        this.drawCircle(-80, -40, 30, this.colors.skin);
        ctx.fillStyle = '#000';
        ctx.fillRect(-85, -45, 5, 8);
        
        // Body
        this.drawBody(-20, -30, 90, 50, this.colors.shirt);
        
        // Arms
        this.drawLimb(-60, -20, -90, 10, 16, this.colors.skin);
        this.drawLimb(-90, 10, -110, 40, 14, this.colors.skin);
        this.drawCircle(-110, 40, 12, this.colors.skin);
        
        this.drawLimb(30, -20, 60, 10, 16, this.colors.skin);
        this.drawLimb(60, 10, 80, 40, 14, this.colors.skin);
        this.drawCircle(80, 40, 12, this.colors.skin);
        
        // Legs
        this.drawLimb(40, -10, 80, -5, 18, this.colors.pants);
        this.drawLimb(80, -5, 110, 0, 16, this.colors.skin);
        this.drawBody(115, 0, 20, 14, this.colors.shoes);
        
        ctx.restore();
      }

      drawBurpees(t) {
        const cycle = (t * 1.5) % 2;
        if (cycle < 1) {
          this.drawJumpingJack(t);
        } else {
          this.drawPlank(t);
        }
      }

      drawCrunch(t) {
        const crunch = Math.sin(t * 3) * 0.5 + 0.5;
        
        ctx.save();
        ctx.translate(80, 60);
        ctx.rotate(1.57);
        
        // Head
        this.drawCircle(0, -50, 30, this.colors.skin);
        ctx.fillStyle = '#000';
        ctx.fillRect(-5, -55, 5, 8);
        
        // Body with crunch
        ctx.save();
        ctx.rotate(crunch * 0.5);
        this.drawBody(0, 30, 50, 80, this.colors.shirt);
        
        // Legs
        this.drawLimb(0, 70, -30, 120, 18, this.colors.pants);
        this.drawLimb(-30, 120, -40, 160, 16, this.colors.skin);
        this.drawBody(-40, 165, 22, 12, this.colors.shoes);
        
        this.drawLimb(0, 70, 30, 120, 18, this.colors.pants);
        this.drawLimb(30, 120, 40, 160, 16, this.colors.skin);
        this.drawBody(40, 165, 22, 12, this.colors.shoes);
        ctx.restore();
        
        // Arms
        this.drawLimb(0, -20, -50, -30, 14, this.colors.skin);
        this.drawCircle(-50, -30, 10, this.colors.skin);
        
        this.drawLimb(0, -20, 50, -30, 14, this.colors.skin);
        this.drawCircle(50, -30, 10, this.colors.skin);
        
        ctx.restore();
      }

      drawBridge(t) {
        ctx.save();
        ctx.translate(0, 110);
        
        // Head
        this.drawCircle(-75, -100, 30, this.colors.skin);
        ctx.fillStyle = '#000';
        ctx.fillRect(-80, -105, 5, 8);
        
        // Body arched
        ctx.strokeStyle = this.colors.shirt;
        ctx.lineWidth = 50;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-50, -80);
        ctx.quadraticCurveTo(0, -110, 50, -80);
        ctx.stroke();
        
        // Arms
        this.drawLimb(-50, -80, -80, -40, 14, this.colors.skin);
        this.drawLimb(-80, -40, -90, 0, 12, this.colors.skin);
        this.drawCircle(-90, 0, 10, this.colors.skin);
        
        this.drawLimb(50, -80, 80, -40, 14, this.colors.skin);
        this.drawLimb(80, -40, 90, 0, 12, this.colors.skin);
        this.drawCircle(90, 0, 10, this.colors.skin);
        
        // Legs
        this.drawLimb(-15, -70, -35, -15, 18, this.colors.pants);
        this.drawLimb(-35, -15, -45, 25, 16, this.colors.skin);
        this.drawBody(-45, 30, 22, 12, this.colors.shoes);
        
        this.drawLimb(15, -70, 35, -15, 18, this.colors.pants);
        this.drawLimb(35, -15, 45, 25, 16, this.colors.skin);
        this.drawBody(45, 30, 22, 12, this.colors.shoes);
        
        ctx.restore();
      }

      drawSuperman(t) {
        const wave = Math.sin(t * 2) * 10;
        
        ctx.save();
        ctx.translate(-40, 30);
        ctx.rotate(-0.2);
        
        // Head
        this.drawCircle(-50, -40 + wave, 30, this.colors.skin);
        ctx.fillStyle = '#000';
        ctx.fillRect(-55, -45 + wave, 5, 8);
        
        // Body
        this.drawBody(20, -20 + wave * 0.7, 90, 45, this.colors.shirt);
        
        // Arms forward
        this.drawLimb(-20, -30 + wave, -70, -55 + wave, 14, this.colors.skin);
        this.drawLimb(-70, -55 + wave, -110, -65 + wave, 12, this.colors.skin);
        this.drawCircle(-110, -65 + wave, 10, this.colors.skin);
        
        this.drawLimb(-20, -10 + wave, -70, -30 + wave, 14, this.colors.skin);
        this.drawLimb(-70, -30 + wave, -110, -40 + wave, 12, this.colors.skin);
        this.drawCircle(-110, -40 + wave, 10, this.colors.skin);
        
        // Legs back
        this.drawLimb(70, -10 + wave * 0.5, 110, -25 + wave * 0.3, 18, this.colors.pants);
        this.drawLimb(110, -25 + wave * 0.3, 145, -30 + wave * 0.2, 16, this.colors.skin);
        this.drawBody(150, -30 + wave * 0.2, 20, 14, this.colors.shoes);
        
        this.drawLimb(70, 10 + wave * 0.5, 110, 5 + wave * 0.3, 18, this.colors.pants);
        this.drawLimb(110, 5 + wave * 0.3, 145, 0 + wave * 0.2, 16, this.colors.skin);
        this.drawBody(150, 0 + wave * 0.2, 20, 14, this.colors.shoes);
        
        ctx.restore();
      }

      drawStretch(t) {
        const stretch = Math.sin(t * 1.5) * 0.15;
        
        // Head
        this.drawCircle(0, -110, 30, this.colors.skin);
        ctx.fillStyle = '#000';
        ctx.fillRect(-10, -115, 5, 8);
        ctx.fillRect(5, -115, 5, 8);
        // Smile
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, -105, 12, 0.2, Math.PI - 0.2);
        ctx.stroke();
        
        // Body
        this.drawBody(0, -40, 50, 80, this.colors.shirt);
        
        // Arms stretched up
        ctx.save();
        ctx.translate(-25, -60);
        ctx.rotate(stretch - 0.6);
        this.drawLimb(0, 0, -50, -60, 14, this.colors.skin);
        this.drawLimb(-50, -60, -60, -100, 12, this.colors.skin);
        this.drawCircle(-60, -100, 10, this.colors.skin);
        ctx.restore();
        
        ctx.save();
        ctx.translate(25, -60);
        ctx.rotate(-stretch + 0.6);
        this.drawLimb(0, 0, 50, -60, 14, this.colors.skin);
        this.drawLimb(50, -60, 60, -100, 12, this.colors.skin);
        this.drawCircle(60, -100, 10, this.colors.skin);
        ctx.restore();
        
        // Legs
        this.drawLimb(-15, 5, -25, 80, 18, this.colors.pants);
        this.drawLimb(-25, 80, -30, 135, 16, this.colors.skin);
        this.drawBody(-30, 140, 22, 12, this.colors.shoes);
        
        this.drawLimb(15, 5, 25, 80, 18, this.colors.pants);
        this.drawLimb(25, 80, 30, 135, 16, this.colors.skin);
        this.drawBody(30, 140, 22, 12, this.colors.shoes);
      }
    }

    const character = new Character();

    function animateCharacter() {
      if (state.isRunning && !state.isPaused) {
        const currentEx = EXERCISES[state.currentIndex];
        character.drawSmooth(currentEx.id);
      } else {
        character.drawSmooth('r');
      }
      requestAnimationFrame(animateCharacter);
    }
    animateCharacter();

    // ========================================
    // RESTO CODICE (gestione timer, audio, etc.)
    // ========================================
    function formatTime(sec) {
      const m = Math.floor(sec/60);
      const s = sec%60;
      return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
    }

    function updateDisplay() {
      const ex = EXERCISES[state.currentIndex];
      const [name, reps] = NAMES[lang][ex.id];
      
      getEl('exName').textContent = name.toUpperCase();
      getEl('exName').className = ex.id==='r' ? 'rest' : 'work';
      getEl('reps').textContent = reps;
      getEl('exTime').textContent = formatTime(state.timeLeft);
      getEl('totTime').textContent = formatTime(state.globalTimeLeft);
      getEl('exNum').textContent = `${state.currentIndex+1}/${EXERCISES.length}`;
      
      const nextEx = EXERCISES[state.currentIndex+1];
      if (nextEx) {
        const [nextName] = NAMES[lang][nextEx.id];
        getEl('next').textContent = nextName.toUpperCase();
      } else {
        getEl('next').textContent = 'ULTIMO!';
      }
      
      const progress = Math.round(((TOTAL_TIME-state.globalTimeLeft)/TOTAL_TIME)*100);
      getEl('prog').style.width = progress + '%';
      getEl('pct').textContent = progress + '%';
      
      const timeEl = getEl('exTime');
      timeEl.classList.remove('warn','crit');
      if (state.timeLeft <= 3) {
        timeEl.classList.add('crit');
      } else if (state.timeLeft <= 10) {
        timeEl.classList.add('warn');
      }
    }

    function tick() {
      if (state.isPaused) return;
      
      if (state.timeLeft === 3 || state.timeLeft === 2 || state.timeLeft === 1) {
        beep(600 + state.timeLeft*100, 0.1);
      }
      
      if (state.timeLeft <= 0) {
        state.currentIndex++;
        if (state.currentIndex >= EXERCISES.length) {
          finishWorkout();
          return;
        }
        state.timeLeft = EXERCISES[state.currentIndex].dur;
        beep(800, 0.1);
        setTimeout(() => beep(1000, 0.1), 150);
        updateDisplay();
      } else {
        state.timeLeft--;
        state.globalTimeLeft--;
        updateDisplay();
      }
    }

    function startWorkout() {
      if (state.isRunning && !state.isPaused) return;
      
      if (!state.isRunning) {
        state.currentIndex = 0;
        state.globalTimeLeft = TOTAL_TIME;
        state.timeLeft = EXERCISES[0].dur;
        updateDisplay();
      }
      
      state.isRunning = true;
      state.isPaused = false;
      
      getEl('startBtn').disabled = true;
      getEl('pauseBtn').disabled = false;
      getEl('resetBtn').disabled = false;
      
      state.timer = setInterval(tick, 1000);
      startMusic();
    }

    function pauseWorkout() {
      if (!state.isPaused) {
        state.isPaused = true;
        clearInterval(state.timer);
        stopMusic();
        getEl('pauseBtn').textContent = '▶ RIPRENDI';
        beep(400, 0.2);
      } else {
        state.isPaused = false;
        getEl('pauseBtn').textContent = '⏸ PAUSA';
        state.timer = setInterval(tick, 1000);
        startMusic();
        beep(800, 0.2);
      }
    }

    function resetWorkout() {
      clearInterval(state.timer);
      stopMusic();
      state.isRunning = false;
      state.isPaused = false;
      state.currentIndex = 0;
      state.globalTimeLeft = TOTAL_TIME;
      state.timeLeft = 0;
      
      getEl('exName').textContent = 'PREMI START';
      getEl('exName').className = 'work';
      getEl('exTime').textContent = '00:00';
      getEl('reps').textContent = '';
      getEl('totTime').textContent = formatTime(TOTAL_TIME);
      getEl('next').textContent = '-';
      getEl('exNum').textContent = `0/${EXERCISES.length}`;
      getEl('prog').style.width = '0%';
      getEl('pct').textContent = '0%';
      getEl('exTime').classList.remove('warn','crit');
      
      getEl('startBtn').disabled = false;
      getEl('startBtn').textContent = '▶ START';
      getEl('pauseBtn').disabled = true;
      getEl('pauseBtn').textContent = '⏸ PAUSA';
      getEl('resetBtn').disabled = true;
    }

    function finishWorkout() {
      clearInterval(state.timer);
      stopMusic();
      state.isRunning = false;
      
      beep(600, 0.1);
      setTimeout(() => beep(800, 0.1), 120);
      setTimeout(() => beep(1200, 0.2), 240);
      
      saveWorkout();
      updateToday();
      
      getEl('totW').textContent = getTotalWorkouts();
      getEl('doneScreen').classList.add('show');
      
      getEl('startBtn').disabled = false;
      getEl('pauseBtn').disabled = true;
      getEl('resetBtn').disabled = false;
    }

    function saveWorkout() {
      const today = new Date().toDateString();
      const stats = JSON.parse(localStorage.getItem('workouts') || '{}');
      stats[today] = (stats[today] || 0) + 1;
      localStorage.setItem('workouts', JSON.stringify(stats));
    }

    function getTodayWorkouts() {
      const today = new Date().toDateString();
      const stats = JSON.parse(localStorage.getItem('workouts') || '{}');
      return stats[today] || 0;
    }

    function getTotalWorkouts() {
      const stats = JSON.parse(localStorage.getItem('workouts') || '{}');
      return Object.values(stats).reduce((a,b) => a+b, 0);
    }

    function updateToday() {
      getEl('today').textContent = getTodayWorkouts();
    }

    getEl('startBtn').addEventListener('click', startWorkout);
    getEl('pauseBtn').addEventListener('click', pauseWorkout);
    getEl('resetBtn').addEventListener('click', resetWorkout);
    getEl('closeBtn').addEventListener('click', () => getEl('doneScreen').classList.remove('show'));

    document.addEventListener('keydown', e => {
      if (e.code === 'Space') {
        e.preventDefault();
        if (!state.isRunning) startWorkout();
        else pauseWorkout();
      } else if (e.code === 'Escape') {
        resetWorkout();
      }
    });

    getEl('totTime').textContent = formatTime(TOTAL_TIME);
    updateToday();
    console.log('✅ Personaggio 2D Professional pronto!');
  </script>
</body>
</html>
