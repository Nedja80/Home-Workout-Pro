<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Workout TV Pro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    #app {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 1.5vh 1vw;
      gap: 1vh;
    }
    .header {
      text-align: center;
      flex-shrink: 0;
    }
    .header h1 {
      font-size: 4vh;
      color: #00d4ff;
      margin-bottom: 0.5vh;
    }
    .header p {
      font-size: 2vh;
    }
    .main {
      display: flex;
      flex: 1;
      gap: 1vw;
      min-height: 0;
    }
    .left {
      width: 18vw;
      display: flex;
      flex-direction: column;
      gap: 1vh;
    }
    .box {
      background: rgba(0, 212, 255, 0.15);
      border: 3px solid #00d4ff;
      border-radius: 12px;
      padding: 2vh 1vw;
      text-align: center;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .label {
      font-size: 1.8vh;
      opacity: 0.7;
      margin-bottom: 0.5vh;
      font-weight: bold;
    }
    .value {
      font-size: 4vh;
      font-weight: bold;
      color: #00d4ff;
    }
    .center {
      flex: 1;
      background: rgba(0, 212, 255, 0.1);
      border: 4px solid #00d4ff;
      border-radius: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1vh;
      min-height: 0;
    }
    #exName {
      font-size: 3.5vh;
      font-weight: bold;
      margin-bottom: 1vh;
    }
    #exName.work { color: #00d4ff; }
    #exName.rest { color: #00ff88; }
    canvas {
      width: 30vh;
      height: 30vh;
      max-width: 400px;
      max-height: 400px;
    }
    #exTime {
      font-size: 8vh;
      font-weight: bold;
      margin: 1vh 0;
    }
    #exTime.warn { color: #ffaa00; }
    #exTime.crit { color: #ff4444; animation: blink 0.5s infinite; }
    @keyframes blink { 50% { opacity: 0.6; } }
    #reps {
      font-size: 2.5vh;
      color: #00d4ff;
      font-style: italic;
    }
    .right {
      width: 18vw;
      display: flex;
      flex-direction: column;
      gap: 1vh;
    }
    .nextbox {
      background: rgba(0, 255, 136, 0.15);
      border: 3px solid #00ff88;
      border-radius: 12px;
      padding: 2vh 1vw;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    #next {
      font-size: 2vh;
      color: #00ff88;
      font-weight: bold;
      margin-top: 1vh;
      line-height: 1.3;
    }
    .progbox {
      background: rgba(255, 255, 255, 0.1);
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      padding: 2vh 1vw;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .bar {
      width: 100%;
      height: 2.5vh;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 1.25vh;
      overflow: hidden;
      margin-top: 1vh;
    }
    .fill {
      height: 100%;
      background: linear-gradient(90deg, #00d4ff, #00ff88);
      width: 0%;
      transition: width 1s;
    }
    #pct {
      margin-top: 0.5vh;
      font-size: 2.5vh;
      text-align: center;
      font-weight: bold;
    }
    .btns {
      display: flex;
      justify-content: center;
      gap: 1.5vw;
      flex-shrink: 0;
      padding: 1vh 0;
    }
    button {
      font-size: 2.5vh;
      padding: 1.5vh 4vw;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.2s;
    }
    button:hover:not(:disabled) { 
      transform: scale(1.05); 
    }
    button:active:not(:disabled) {
      transform: scale(0.98);
    }
    button:disabled { 
      opacity: 0.3; 
      cursor: not-allowed;
    }
    .btn1 { 
      background: linear-gradient(135deg, #00d4ff, #0099cc); 
      color: #fff; 
    }
    .btn2 { 
      background: linear-gradient(135deg, #ffaa00, #ff8800); 
      color: #fff; 
    }
    .btn3 { 
      background: linear-gradient(135deg, #ff4444, #cc0000); 
      color: #fff; 
    }
    .settings {
      position: fixed;
      top: 1vh;
      right: 1vw;
      display: flex;
      gap: 0.8vw;
      z-index: 100;
    }
    .settings label {
      background: rgba(0, 0, 0, 0.7);
      padding: 0.8vh 1.5vw;
      border-radius: 8px;
      border: 2px solid #00d4ff;
      font-size: 1.6vh;
      display: flex;
      align-items: center;
      gap: 0.5vw;
      cursor: pointer;
    }
    .settings select {
      padding: 0.8vh 1.5vw;
      border-radius: 8px;
      font-size: 1.6vh;
      background: #111;
      color: #fff;
      border: 2px solid #00d4ff;
      cursor: pointer;
    }
    .done {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.95);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }
    .done.show { display: flex; }
    .done-box {
      background: rgba(0, 255, 136, 0.2);
      border: 4px solid #00ff88;
      border-radius: 30px;
      padding: 60px 100px;
      text-align: center;
    }
    .done-box h2 {
      font-size: 80px;
      color: #00ff88;
      margin-bottom: 30px;
    }
    .done-box p {
      font-size: 35px;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <div class="settings">
    <label><input type="checkbox" id="snd" checked> 🔊</label>
    <label><input type="checkbox" id="mus" checked> 🎵</label>
    <select id="lng">
      <option value="it">🇮🇹</option>
      <option value="en">🇬🇧</option>
    </select>
  </div>

  <div id="app">
    <div class="header">
      <h1>💪 ALLENAMENTO CASA PRO</h1>
      <p>Routine completa di 20 minuti</p>
    </div>
    
    <div class="main">
      <div class="left">
        <div class="box">
          <div class="label">TEMPO TOTALE</div>
          <div class="value" id="totTime">20:00</div>
        </div>
        <div class="box">
          <div class="label">ESERCIZIO</div>
          <div class="value" id="exNum">0/37</div>
        </div>
        <div class="box">
          <div class="label">OGGI</div>
          <div class="value" id="today">0</div>
        </div>
      </div>
      
      <div class="center">
        <div id="exName" class="work">PREMI START</div>
        <canvas id="cv" width="500" height="500"></canvas>
        <div id="exTime">00:00</div>
        <div id="reps"></div>
      </div>
      
      <div class="right">
        <div class="nextbox">
          <div class="label">⏭ PROSSIMO</div>
          <div id="next">-</div>
        </div>
        <div class="progbox">
          <div class="label">PROGRESSO</div>
          <div class="bar">
            <div class="fill" id="prog"></div>
          </div>
          <div id="pct">0%</div>
        </div>
      </div>
    </div>
    
    <div class="btns">
      <button class="btn1" id="startBtn">▶ START</button>
      <button class="btn2" id="pauseBtn" disabled>⏸ PAUSA</button>
      <button class="btn3" id="resetBtn" disabled>↻ RESET</button>
    </div>
  </div>

  <div class="done" id="doneScreen">
    <div class="done-box">
      <h2>🎉 COMPLETATO!</h2>
      <p>Ottimo lavoro!<br>Hai bruciato circa <strong>150-200 calorie</strong>!</p>
      <p>Totale: <strong id="totW">0</strong> allenamenti</p>
      <button class="btn1" style="margin-top:40px;" id="closeBtn">OK</button>
    </div>
  </div>

  <script>
    console.log('🚀 App avviata');
    
    // ESERCIZI - 37 totali per 20 minuti ESATTI
    const EXERCISES = [
      {id:'w',dur:50},{id:'r',dur:20},
      {id:'s',dur:45},{id:'r',dur:20},
      {id:'l',dur:45},{id:'r',dur:20},
      {id:'p',dur:40},{id:'r',dur:20},
      {id:'k',dur:35},{id:'r',dur:20},
      {id:'m',dur:45},{id:'r',dur:20},
      {id:'b',dur:35},{id:'r',dur:20},
      {id:'c',dur:45},{id:'r',dur:20},
      {id:'h',dur:45},{id:'r',dur:20},
      {id:'g',dur:45},{id:'r',dur:20},
      {id:'j',dur:50},{id:'r',dur:20},
      {id:'s',dur:45},{id:'r',dur:20},
      {id:'u',dur:35},{id:'r',dur:20},
      {id:'l',dur:45},{id:'r',dur:20},
      {id:'p',dur:40},{id:'r',dur:20},
      {id:'m',dur:45},{id:'r',dur:20},
      {id:'c',dur:45},{id:'r',dur:20},
      {id:'j',dur:45},{id:'r',dur:20},
      {id:'t',dur:60}
    ];

    const TOTAL_TIME = EXERCISES.reduce((sum, ex) => sum + ex.dur, 0);
    console.log('✅ Tempo totale:', TOTAL_TIME, 'secondi =', Math.floor(TOTAL_TIME/60), 'minuti');

    const NAMES = {
      it: {
        w:['Riscaldamento: Jumping Jack','30-40 ripetizioni'],
        r:['Riposo',''],
        s:['Squat','15-20 ripetizioni'],
        l:['Affondi Alternati','10-12 per gamba'],
        p:['Push-up','10-15 ripetizioni'],
        k:['Plank','mantieni posizione'],
        m:['Mountain Climbers','30-40 ripetizioni'],
        b:['Burpees','8-12 ripetizioni'],
        c:['Crunch','20-25 ripetizioni'],
        h:['High Knees','40-50 ripetizioni'],
        g:['Ponte Glutei','15-20 ripetizioni'],
        j:['Jumping Jacks','30-40 ripetizioni'],
        u:['Superman','15-20 ripetizioni'],
        t:['Stretching','respira profondamente']
      },
      en: {
        w:['Warm-up: Jumping Jacks','30-40 reps'],
        r:['Rest',''],
        s:['Squats','15-20 reps'],
        l:['Alternating Lunges','10-12 per leg'],
        p:['Push-ups','10-15 reps'],
        k:['Plank','hold position'],
        m:['Mountain Climbers','30-40 reps'],
        b:['Burpees','8-12 reps'],
        c:['Crunches','20-25 reps'],
        h:['High Knees','40-50 reps'],
        g:['Glute Bridge','15-20 reps'],
        j:['Jumping Jacks','30-40 reps'],
        u:['Superman','15-20 reps'],
        t:['Stretching','breathe deeply']
      }
    };

    let lang = 'it';
    const canvas = document.getElementById('cv');
    const ctx = canvas.getContext('2d');

    let state = {
      currentIndex: 0,
      timeLeft: 0,
      globalTimeLeft: TOTAL_TIME,
      timer: null,
      isPaused: false,
      isRunning: false,
      animFrame: 0
    };

    let audioCtx = null;
    let musicTimer = null;

    function getEl(id) {
      return document.getElementById(id);
    }

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        console.log('🔊 Audio inizializzato');
      }
    }

    function beep(freq, dur) {
      if (!getEl('snd').checked) return;
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    }

    function startMusic() {
      if (!getEl('mus').checked) return;
      initAudio();
      stopMusic();
      const notes = [262, 330, 392, 330];
      let idx = 0;
      musicTimer = setInterval(() => {
        if (!getEl('mus').checked || !state.isRunning || state.isPaused) {
          stopMusic();
          return;
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = notes[idx];
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
        idx = (idx + 1) % notes.length;
      }, 400);
      console.log('🎵 Musica avviata');
    }

    function stopMusic() {
      if (musicTimer) {
        clearInterval(musicTimer);
        musicTimer = null;
        console.log('🎵 Musica fermata');
      }
    }

    function drawFigure(exId) {
      ctx.clearRect(0, 0, 500, 500);
      ctx.strokeStyle = '#00d4ff';
      ctx.lineWidth = 12;
      ctx.lineCap = 'round';
      const cx = 250, cy = 250, f = state.animFrame;

      ctx.beginPath();
      ctx.arc(cx, cy-120, 30, 0, Math.PI*2);
      ctx.stroke();

      function line(x1,y1,x2,y2) {
        ctx.beginPath();
        ctx.moveTo(x1,y1);
        ctx.lineTo(x2,y2);
        ctx.stroke();
      }

      if (exId === 'r') {
        line(cx, cy-90, cx, cy+20);
        line(cx, cy-60, cx-60, cy);
        line(cx, cy-60, cx+60, cy);
        line(cx, cy+20, cx-40, cy+100);
        line(cx, cy+20, cx+40, cy+100);
      } else if (exId === 'w' || exId === 'j') {
        const a = Math.sin(f*0.2)*0.6;
        line(cx, cy-90, cx, cy+20);
        line(cx, cy-60, cx-80*Math.abs(Math.cos(a)), cy-40*Math.sin(a));
        line(cx, cy-60, cx+80*Math.abs(Math.cos(a)), cy-40*Math.sin(a));
        line(cx, cy+20, cx-50*Math.abs(Math.cos(a)), cy+100);
        line(cx, cy+20, cx+50*Math.abs(Math.cos(a)), cy+100);
      } else if (exId === 's') {
        const d = Math.sin(f*0.15)*40;
        line(cx, cy-90+d, cx, cy+20+d);
        line(cx, cy-60+d, cx-70, cy-20+d);
        line(cx, cy-60+d, cx+70, cy-20+d);
        line(cx, cy+20+d, cx-50, cy+90+d);
        line(cx, cy+20+d, cx+50, cy+90+d);
      } else if (exId === 'l' || exId === 'h' || exId === 'm') {
        const a = Math.sin(f*0.25)*0.7;
        line(cx, cy-90, cx, cy+20);
        ctx.save();
        ctx.translate(cx, cy-60);
        ctx.rotate(-a*0.8);
        line(0,0,-70,40);
        ctx.restore();
        ctx.save();
        ctx.translate(cx, cy-60);
        ctx.rotate(a*0.8);
        line(0,0,70,40);
        ctx.restore();
        ctx.save();
        ctx.translate(cx, cy+20);
        ctx.rotate(a);
        line(0,0,-30,80);
        ctx.restore();
        ctx.save();
        ctx.translate(cx, cy+20);
        ctx.rotate(-a);
        line(0,0,30,80);
        ctx.restore();
      } else if (exId === 'p' || exId === 'k') {
        const d = exId==='p' ? Math.sin(f*0.2)*15 : 0;
        ctx.save();
        ctx.translate(cx, cy+50+d);
        ctx.rotate(-0.1);
        ctx.beginPath();
        ctx.arc(0,-40,30,Math.PI,0);
        ctx.stroke();
        line(-120,-15,120,-15);
        line(-120,-15,-130,25);
        line(120,-15,130,25);
        line(-100,-15,-120,50);
        line(100,-15,120,50);
        ctx.restore();
      } else if (exId === 'b') {
        const p = (f%60)/60;
        if (p < 0.5) {
          line(cx, cy-90, cx, cy+20);
          line(cx, cy-60, cx-60, cy);
          line(cx, cy-60, cx+60, cy);
          line(cx, cy+20, cx-40, cy+100);
          line(cx, cy+20, cx+40, cy+100);
        } else {
          ctx.save();
          ctx.translate(cx, cy+50);
          ctx.rotate(-0.1);
          ctx.beginPath();
          ctx.arc(0,-40,30,Math.PI,0);
          ctx.stroke();
          line(-120,-15,120,-15);
          line(-120,-15,-130,25);
          line(120,-15,130,25);
          ctx.restore();
        }
      } else if (exId === 'c') {
        const a = Math.sin(f*0.2)*0.3;
        ctx.save();
        ctx.translate(cx+80, cy+40);
        ctx.rotate(1.57);
        ctx.beginPath();
        ctx.arc(0,-40,30,0,Math.PI*2);
        ctx.stroke();
        ctx.save();
        ctx.rotate(a);
        line(0,-10,0,80);
        ctx.restore();
        line(0,0,-60,30);
        line(0,0,60,30);
        line(0,80,-40,140);
        line(0,80,40,140);
        ctx.restore();
      } else if (exId === 'g') {
        ctx.save();
        ctx.translate(cx, cy+100);
        ctx.beginPath();
        ctx.arc(-80,-90,30,0,Math.PI*2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(-80,-90,30,0,Math.PI);
        ctx.moveTo(-115,-90);
        ctx.lineTo(-30,0);
        ctx.lineTo(30,0);
        ctx.lineTo(115,-90);
        ctx.stroke();
        line(-115,-90,-135,-45);
        line(115,-90,135,-45);
        line(-30,0,-50,55);
        line(30,0,50,55);
        ctx.restore();
      } else if (exId === 'u') {
        const w = Math.sin(f*0.15)*10;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.beginPath();
        ctx.arc(-90,-25+w,30,0,Math.PI*2);
        ctx.stroke();
        line(-90,5+w, 110,-5);
        line(-55,-15+w, -130,-45+w);
        line(-55,-15+w, -130,15+w);
        line(90,-15, 145,-35);
        line(90,-5, 145,15);
        ctx.restore();
      } else if (exId === 't') {
        const s = Math.sin(f*0.1)*0.2;
        line(cx, cy-90, cx, cy+20);
        ctx.save();
        ctx.translate(cx, cy-60);
        ctx.rotate(s-0.5);
        line(0,0,-90,-35);
        ctx.restore();
        ctx.save();
        ctx.translate(cx, cy-60);
        ctx.rotate(-s+0.5);
        line(0,0,90,-35);
        ctx.restore();
        line(cx, cy+20, cx-40, cy+100);
        line(cx, cy+20, cx+40, cy+100);
      } else {
        line(cx, cy-90, cx, cy+20);
        line(cx, cy-60, cx-60, cy);
        line(cx, cy-60, cx+60, cy);
        line(cx, cy+20, cx-40, cy+100);
        line(cx, cy+20, cx+40, cy+100);
      }

      state.animFrame++;
    }

    function animate() {
      if (state.isRunning && !state.isPaused) {
        drawFigure(EXERCISES[state.currentIndex].id);
      }
      requestAnimationFrame(animate);
    }
    animate();

    function formatTime(sec) {
      const m = Math.floor(sec/60);
      const s = sec%60;
      return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
    }

    function updateDisplay() {
      const ex = EXERCISES[state.currentIndex];
      const [name, reps] = NAMES[lang][ex.id];
      
      getEl('exName').textContent = name.toUpperCase();
      getEl('exName').className = ex.id==='r' ? 'rest' : 'work';
      getEl('reps').textContent = reps;
      getEl('exTime').textContent = formatTime(state.timeLeft);
      getEl('totTime').textContent = formatTime(state.globalTimeLeft);
      getEl('exNum').textContent = `${state.currentIndex+1}/${EXERCISES.length}`;
      
      const nextEx = EXERCISES[state.currentIndex+1];
      if (nextEx) {
        const [nextName] = NAMES[lang][nextEx.id];
        getEl('next').textContent = nextName.toUpperCase();
      } else {
        getEl('next').textContent = 'ULTIMO!';
      }
      
      const progress = Math.round(((TOTAL_TIME-state.globalTimeLeft)/TOTAL_TIME)*100);
      getEl('prog').style.width = progress + '%';
      getEl('pct').textContent = progress + '%';
      
      const timeEl = getEl('exTime');
      timeEl.classList.remove('warn','crit');
      if (state.timeLeft <= 3) {
        timeEl.classList.add('crit');
      } else if (state.timeLeft <= 10) {
        timeEl.classList.add('warn');
      }
    }

    function tick() {
      if (state.isPaused) return;
      
      if (state.timeLeft === 3 || state.timeLeft === 2 || state.timeLeft === 1) {
        beep(600 + state.timeLeft*100, 0.1);
      }
      
      if (state.timeLeft <= 0) {
        state.currentIndex++;
        if (state.currentIndex >= EXERCISES.length) {
          finishWorkout();
          return;
        }
        state.timeLeft = EXERCISES[state.currentIndex].dur;
        beep(800, 0.1);
        setTimeout(() => beep(1000, 0.1), 150);
        updateDisplay();
      } else {
        state.timeLeft--;
        state.globalTimeLeft--;
        updateDisplay();
      }
    }

    function startWorkout() {
      console.log('▶️ START cliccato');
      
      if (state.isRunning && !state.isPaused) {
        console.log('⚠️ Già in esecuzione');
        return;
      }
      
      if (!state.isRunning) {
        console.log('🆕 Nuovo allenamento');
        state.currentIndex = 0;
        state.globalTimeLeft = TOTAL_TIME;
        state.timeLeft = EXERCISES[0].dur;
        updateDisplay();
      }
      
      state.isRunning = true;
      state.isPaused = false;
      
      getEl('startBtn').disabled = true;
      getEl('pauseBtn').disabled = false;
      getEl('resetBtn').disabled = false;
      
      state.timer = setInterval(tick, 1000);
      startMusic();
      
      console.log('✅ Allenamento avviato');
    }

    function pauseWorkout() {
      console.log('⏸️ PAUSE cliccato');
      
      if (!state.isPaused) {
        state.isPaused = true;
        clearInterval(state.timer);
        stopMusic();
        getEl('pauseBtn').textContent = '▶ RIPRENDI';
        beep(400, 0.2);
        console.log('⏸️ In pausa');
      } else {
        state.isPaused = false;
        getEl('pauseBtn').textContent = '⏸ PAUSA';
        state.timer = setInterval(tick, 1000);
        startMusic();
        beep(800, 0.2);
        console.log('▶️ Ripreso');
      }
    }

    function resetWorkout() {
      console.log('↻ RESET cliccato');
      
      clearInterval(state.timer);
      stopMusic();
      state.isRunning = false;
      state.isPaused = false;
      state.currentIndex = 0;
      state.globalTimeLeft = TOTAL_TIME;
      state.timeLeft = 0;
      
      getEl('exName').textContent = 'PREMI START';
      getEl('exName').className = 'work';
      getEl('exTime').textContent = '00:00';
      getEl('reps').textContent = '';
      getEl('totTime').textContent = formatTime(TOTAL_TIME);
      getEl('next').textContent = '-';
      getEl('exNum').textContent = `0/${EXERCISES.length}`;
      getEl('prog').style.width = '0%';
      getEl('pct').textContent = '0%';
      getEl('exTime').classList.remove('warn','crit');
      
      getEl('startBtn').disabled = false;
      getEl('startBtn').textContent = '▶ START';
      getEl('pauseBtn').disabled = true;
      getEl('pauseBtn').textContent = '⏸ PAUSA';
      getEl('resetBtn').disabled = true;
      
      drawFigure('r');
      console.log('↻ Reset completato');
    }

    function finishWorkout() {
      console.log('🏁 Allenamento completato!');
      
      clearInterval(state.timer);
      stopMusic();
      state.isRunning = false;
      
      beep(600, 0.1);
      setTimeout(() => beep(800, 0.1), 120);
      setTimeout(() => beep(1200, 0.2), 240);
      
      saveWorkout();
      updateToday();
      
      getEl('totW').textContent = getTotalWorkouts();
      getEl('doneScreen').classList.add('show');
      
      getEl('startBtn').disabled = false;
      getEl('pauseBtn').disabled = true;
      getEl('resetBtn').disabled = false;
      
      drawFigure('r');
    }

    function saveWorkout() {
      const today = new Date().toDateString();
      const stats = JSON.parse(localStorage.getItem('workouts') || '{}');
      stats[today] = (stats[today] || 0) + 1;
      localStorage.setItem('workouts', JSON.stringify(stats));
      console.log('💾 Allenamento salvato');
    }

    function getTodayWorkouts() {
      const today = new Date().toDateString();
      const stats = JSON.parse(localStorage.getItem('workouts') || '{}');
      return stats[today] || 0;
    }

    function getTotalWorkouts() {
      const stats = JSON.parse(localStorage.getItem('workouts') || '{}');
      return Object.values(stats).reduce((a,b) => a+b, 0);
    }

    function updateToday() {
      getEl('today').textContent = getTodayWorkouts();
    }

    // EVENT LISTENERS
    console.log('📝 Registrazione event listeners...');
    
    getEl('startBtn').addEventListener('click', function() {
      console.log('👆 Click su START rilevato');
      startWorkout();
    });
    
    getEl('pauseBtn').addEventListener('click', function() {
      console.log('👆 Click su PAUSE rilevato');
      pauseWorkout();
    });
    
    getEl('resetBtn').addEventListener('click', function() {
      console.log('👆 Click su RESET rilevato');
      resetWorkout();
    });
    
    getEl('closeBtn').addEventListener('click', function() {
      getEl('doneScreen').classList.remove('show');
    });

    document.addEventListener('keydown', function(e) {
      if (e.code === 'Space') {
        e.preventDefault();
        if (!state.isRunning) {
          startWorkout();
        } else {
          pauseWorkout();
        }
      } else if (e.code === 'Escape') {
        resetWorkout();
      }
    });

    // INIT
    console.log('🎬 Inizializzazione completata');
    getEl('totTime').textContent = formatTime(TOTAL_TIME);
    updateToday();
    drawFigure('r');
    console.log('✅ App pronta! Premi START per iniziare');
  </script>
</body>
</html>
